<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | The Jabes Lounge</title>
    <!-- Links your unified stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>The Jabes Lounge</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="products.html">product</a>
            <a href="posts.html">Reviews</a>
            <a href="cart.html" class="active">Cart</a>
        </nav>
    </header>
    <main class="cart-container">
        <h2>Your Shopping Cart</h2>
        
        <div id="cart-content">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-body">
                    </tbody>
                </table>
            </div>
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="cart-subtotal">ksh0.00</span>
                </div>
                <div class="summary">
                    <span>Tax (5%):</span>
                    <span id="cart-tax">ksh0.00</span>
                </div>
                <div class="summary total">
                    <span>Total:</span>
                    <span id="cart-total">ksh0.00</span>
                </div>
                <button id="checkout-btn" class="checkout-btn" onclick="alert('Checkout feature coming soon!')">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Jabes Lounge. All rights reserved.</p>
    </footer>

    <!-- Cart Logic Script -->
    <script src="cart.js"></script>

</body>
</html>
