<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - The Jabes Lounge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">HOME</a> |
            <a href="login.html">LOGIN</a> |
            <a href="reviews.html">REVIEWS</a> |
            <a href="products.html">PRODUCTS</a> |
            <a href="cart.html">CART</a>
        </nav>
    </header>
    <main>
        <h1>Our Products</h1>
        <p>Hand-selected drinks that deliver vibes to our customers.</p>
        <div id="product-container"></div>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 The Jabes Lounge. All rights reserved.</p>
    </footer>
    <script src="products-data.js"></script>
    <script>
        const container = document.getElementById('product-container');
        let htmlContent = '';
        productsData.forEach(product => {
            htmlContent += `
                <div style="margin-bottom: 25px; border: 1px solid #444; padding: 15px; border-radius: 8px;">
                    <img src="${product.image}" alt="${product.name}" width="150"><br>
                    <h3>${product.name}</h3>
                    <p>Category: ${product.category}</p>
                    <p><strong>Price: ${product.price}</strong></p>
                    <button type="button">Add to Cart</button>
                </div>
            `;
        });
        container.innerHTML = htmlContent;
    </script>

</body>
</html>
