<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Jabes Lounge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>The Jabes Lounge</h1>
        </div>
        <nav>
            <a href="products.html">products</a>
        </nav>
    </header>
    <main class="login-container">
        <section class="login-card">
            <h2>Customer Login</h2>
            <p class="login-subtitle">Access your account to order fine wines and spirits.</p>

            <form id="login-form">
                <div class="form-user">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" placeholder="Enter your username or email" required>
                </div>
                <div class="form-user">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Log In</button>
            </form>
            <p id="login-message"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 The Jabes Lounge. All rights reserved.</p>
    </footer>

</body>
</html>
